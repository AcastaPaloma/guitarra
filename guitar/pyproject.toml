[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_astra"
version = "0.1.0"
description = "LeRobot plugin for the astra-guitar SO-101 arms (supports renumbered servo IDs)"
requires-python = ">=3.12"
dependencies = ["lerobot[feetech]"]

[project.optional-dependencies]
agent = ["anthropic>=1.7", "openai", "sounddevice", "numpy", "opencv-python-headless"]
baseten = ["jsonschema>=4.23,<5"]
baseten-audio = ["jsonschema>=4.23,<5", "numpy>=1.26,<3", "scipy>=1.13,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "numpy>=1.26,<3"]
# Only needed for the inactive custom Qwen Truss recipe, not managed Model APIs.
baseten-deploy = ["truss>=0.18.30"]
dev = ["pytest"]

[tool.setuptools]
packages = ["lerobot_robot_astra"]
